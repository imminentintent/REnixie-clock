name: update-worldline

on:
  schedule:
    - cron: "*/30 * * * *"   # best-effort on GitHub's side; expect some delay
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: worldline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      WORLDLINE_SCORER: ${{ vars.WORLDLINE_SCORER || 'lexicon' }}   # lexicon | llm | blend
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}          # only needed for llm / blend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional LLM dependency
        if: env.WORLDLINE_SCORER != 'lexicon'
        run: pip install anthropic
      - name: Run tests
        run: python -m unittest discover -s worldline/tests
      - name: Update worldline (commits to the worldline-data branch)
        run: bash scripts/update_worldline.sh
